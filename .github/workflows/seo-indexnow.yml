name: Automated Search Engine Indexing (IndexNow)

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 12 * * 1' # Every Monday at 12:00 UTC
  workflow_dispatch:

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow API
        run: |
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "mahmoudsajjadi.github.io",
              "key": "25a1b920a0c11be947cc6",
              "keyLocation": "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/25a1b920a0c11be947cc6.txt",
              "urlList": [
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/",
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/sitemap.xml",
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/llms.txt",
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/llms-full.txt",
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/comparisons/cursor-vs-windsurf-vs-antigravity-2026.html",
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/comparisons/claude-code-vs-aider-vs-cline-vs-opencode.html",
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/comparisons/best-local-coding-llm-8gb-16gb-24gb-vram-ollama.html",
                "https://mahmoudsajjadi.github.io/awesome-ai-coding-tools/comparisons/agents-md-vs-claude-md-vs-cursor-rules.html"
              ]
            }'
          echo "IndexNow ping completed successfully."
