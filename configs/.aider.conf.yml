# Aider Configuration for Architect Mode & Local / Open Weight Routing

# Use the two-step Architect mode (Reasoning model designs patch, Editor model applies it)
architect: true

# Enable automatic git commits after verified edits
auto-commits: true

# Automatically run tests after every edit loop
auto-lint: true
test-cmd: "pytest"

# Default to rich repository map packed within token budget
map-tokens: 2048

